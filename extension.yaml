id: jcode.ext.vmmanager
name: VM Manager
version: 0.3.5
type: vm
publisher: jcode
description: Create and run x86/x86_64 QEMU virtual machines on this ARM device, incl. a one-click SQL Server VM.
supportedArches: [arm64]
api:
  minApiVersion: 1
  capabilities: [exec, workbench]
requires:
  sdks: [qemu-system-x86]

# --- header fields merged from extension.jehm ---
shortDescription: Create and run x86/x86_64 QEMU VMs — incl. a one-click SQL Server VM — for software with no ARM build.
minJCodeVersion: 1.6.2
targetJCodeVersion: 1.0.0
category: Virtualization
subcategory: QEMU
images:
  icon: media/icon.png
  samples: []
  walkthrough: []
entry:
  manifest: extension.yaml
  libs: []
  # Drawn in JCode's own process rather than a WebView. A bare dex, not an APK: this plugin owns no
  # resources — every icon it draws is a vector built in code.
  native:
    dex: lib/vm.dex
    class: dev.blamspot.jcode.ext.vm.VmExtension
    abi: 3
